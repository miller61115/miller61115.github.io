<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ProteinLog">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="manifest" href="manifest.json">
    <title>Protein Tracker</title>
    
    <!-- Official Stable Barcode & QR CDN Library -->
    <script src="https://jsdelivr.net"></script>

    <style>
        :root {
            --bg-color: #f2f2f7;
            --card-bg: #ffffff;
            --primary: #34c759;
            --accent: #5856d6;
            --danger: #ff3b30;
            --text: #1c1c1e;
            --text-muted: #8e8e93;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            padding: 20px;
            padding-top: 60px;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .total-display {
            font-size: 48px;
            font-weight: 700;
            color: var(--primary);
            margin: 10px 0;
        }
        .card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        h2 { margin-top: 0; font-size: 18px; font-weight: 600; }
        
        /* Barcode Scanner UI Container */
        #barcode-reader-box {
            width: 100%;
            margin-top: 10px;
            border-radius: 12px;
            overflow: hidden;
            border: none !important; /* Overrides library styles */
        }
        
        .db-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .food-btn {
            background: #e5e5ea; border: none; padding: 12px; border-radius: 12px;
            font-size: 14px; font-weight: 500; text-align: left; cursor: pointer;
            display: flex; justify-content: space-between;
        }
        .food-btn span { color: var(--text-muted); }
        .custom-form { display: flex; flex-wrap: wrap; gap: 10px; width: 100%; }
        input {
            flex: 1; min-width: 120px; padding: 12px; border: 1px solid #d1d1d6;
            border-radius: 10px; font-size: 16px; box-sizing: border-box;
        }
        .input-short { max-width: 90px; }
        button.btn-add {
            background: var(--primary); color: white; border: none; padding: 12px 20px;
            border-radius: 10px; font-weight: 600; cursor: pointer; flex-grow: 1; text-align: center; font-size: 15px;
        }
        .log-item { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #e5e5ea; }
        .log-item:last-child { border-bottom: none; }
        .clear-btn {
            background: var(--danger); color: white; border: none; width: 100%; padding: 12px;
            border-radius: 12px; font-weight: 600; margin-top: 10px; font-size: 16px; cursor: pointer;
        }
        #api-result-banner {
            background: #e5e5ea; padding: 12px; border-radius: 10px; margin: 10px 0; font-size: 14px; display: none;
        }
    </style>
</head>
<body>

    <div class="header">
        <div>Today's Protein Intake</div>
        <div class="total-display"><span id="total-protein">0</span>g</div>
    </div>

    <!-- NEW: Barcode Scanner Card -->
    <div class="card">
        <h2>Live Barcode Scanner</h2>
        <div id="barcode-reader-box"></div>
        
        <!-- Dropdown / input form area appearing after a barcode scan completes -->
        <div id="api-result-banner"></div>
        <div class="custom-form" id="weight-form" style="display: none;">
            <input type="number" id="scan-serving-weight" placeholder="Weight eaten (g)" value="100" class="input-short">
            <button class="btn-add" onclick="commitScannedFood()">Log Scanned Item</button>
            <button class="btn-add" style="background:#e5e5ea; color:#1c1c1e;" onclick="clearScanUI()">Cancel</button>
        </div>
    </div>

    <!-- Quick Database Card -->
    <div class="card">
        <h2>Quick Add Database</h2>
        <div class="db-grid" id="db-container"></div>
    </div>

    <!-- Custom Entry Card -->
    <div class="card">
        <h2>Manual Custom Entry</h2>
        <div class="custom-form">
            <input type="text" id="custom-name" placeholder="Food item (e.g. Snack)">
            <input type="number" id="custom-grams" placeholder="Grams" class="input-short">
            <button class="btn-add" onclick="logCustom()">Add Item</button>
        </div>
    </div>

    <!-- Daily Log Card -->
    <div class="card">
        <h2>Today's Log</h2>
        <div id="log-container"></div>
        <button class="clear-btn" onclick="clearLog()">Reset Day</button>
    </div>

    <script>
        const foodDatabase = [
            { name: "Chicken Breast (100g)", protein: 31 },
            { name: "Large Egg (1x)", protein: 6 },
            { name: "Greek Yogurt (150g)", protein: 15 },
            { name: "Canned Tuna (1 can)", protein: 30 },
            { name: "Whey Scoop (1x)", protein: 25 },
            { name: "Peanut Butter (2 tbsp)", protein: 8 }
        ];

        let dailyLog = [];
        let html5QrcodeScanner = null;
        let lastScannedFood = null;

        window.onload = function() {
            init();
            initBarcodeScanner();
        };

        function init() {
            const savedLog = localStorage.getItem('protein_daily_log');
            const savedDate = localStorage.getItem('protein_log_date');
            const todayStr = new Date().toDateString();

            if (savedDate !== todayStr) {
                dailyLog = [];
                localStorage.setItem('protein_log_date', todayStr);
                saveToLocalStorage();
            } else if (savedLog) {
                dailyLog = JSON.parse(savedLog);
            }

            renderDatabase();
            updateUI();

            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('sw.js')
                    .then(() => console.log('Offline Engine Armed.'))
                    .catch(err => console.log('Worker registration failed', err));
            }
        }

        // --- OFFICIAL NATIVE LIBRARY INITIALIZATION ---
        function initBarcodeScanner() {
            // Configuration matching standard grocery dimensions
            const config = { 
                fps: 10, 
                qrbox: { width: 280, height: 160 }, // Horizontal box aspect ratio optimized for barcodes
                rememberLastUsedCamera: true
            };
            
            html5QrcodeScanner = new Html5QrcodeScanner("barcode-reader-box", config, false);
            html5QrcodeScanner.render(onScanSuccess, onScanFailure);
        }

        function onScanFailure(error) {
            // Suppress background frame search failures to preserve computing cycles
        }

        async function onScanSuccess(decodedText, decodedResult) {
            const banner = document.getElementById('api-result-banner');
            banner.style.display = 'block';
            banner.innerText = `Searching barcode: ${decodedText}...`;

            try {
                const response = await fetch(`https://openfoodfacts.org{decodedText}.json`);
                const data = await response.json();

                if (data.status === 1 && data.product) {
                    const prod = data.product;
                    const name = prod.product_name || "Unknown Barcode Item";
                    const protein100g = prod.nutriments ? prod.nutriments.proteins_100g : null;

                    if (protein100g !== null && protein100g !== undefined) {
                        lastScannedFood = { name: name, proteinPer100g: parseFloat(protein100g) };
                        banner.innerHTML = `<strong>Found:</strong> ${name}<br>🧬 Baseline: ${protein100g}g protein per 100g`;
                        document.getElementById('weight-form').style.display = 'flex';
                    } else {
                        banner.innerText = `Found "${name}", but no baseline protein values are documented in Open Food Facts.`;
                    }
                } else {
                    banner.innerText = `Barcode [${decodedText}] not found. Adding placeholder macro metrics...`;
                    lastScannedFood = { name: `Scanned Item (${decodedText})`, proteinPer100g: 12 };
                    document.getElementById('weight-form').style.display = 'flex';
                }
            } catch (err) {
                banner.innerText = "Network connection failed. An internet connection is required to fetch product names.";
            }
        }

        function commitScannedFood() {
            if (!lastScannedFood) return;
            const weightInput = document.getElementById('scan-serving-weight');
            const weightEaten = parseFloat(weightInput.value) || 100;
            const dynamicProtein = Math.round((weightEaten / 100) * lastScannedFood.proteinPer100g);

            logProtein(`${lastScannedFood.name} (${weightEaten}g)`, dynamicProtein);
            clearScanUI();
        }

        function clearScanUI() {
            document.getElementById('api-result-banner').style.display = 'none';
            document.getElementById('weight-form').style.display = 'none';
            lastScannedFood = null;
        }

        // --- LOCAL DATA MIGRATIONS ---
        function renderDatabase() {
