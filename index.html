<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ProteinLog">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="manifest" href="manifest.json">
    <title>Protein Tracker</title>
    
    <!-- Open-Source Barcode Scanner Library -->
    <script src="https://unpkg.com"></script>

    <style>
        :root {
            --bg-color: #f2f2f7;
            --card-bg: #ffffff;
            --primary: #34c759;
            --accent: #5856d6;
            --danger: #ff3b30;
            --text: #1c1c1e;
            --text-muted: #8e8e93;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            padding: 20px;
            padding-top: 60px;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .total-display {
            font-size: 48px;
            font-weight: 700;
            color: var(--primary);
            margin: 10px 0;
        }
        .card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        h2 {
            margin-top: 0;
            font-size: 18px;
            font-weight: 600;
        }
        .custom-form {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            width: 100%;
        }
        input {
            flex: 1;
            min-width: 120px;
            padding: 12px;
            border: 1px solid #d1d1d6;
            border-radius: 10px;
            font-size: 16px;
            box-sizing: border-box;
        }
        .input-short {
            max-width: 90px;
        }
        button {
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            font-size: 15px;
        }
        .btn-add {
            background: var(--primary);
            color: white;
            flex-grow: 1;
            text-align: center;
        }
        .btn-cancel {
            background: #e5e5ea;
            color: #1c1c1e;
            flex-grow: 1;
            text-align: center;
        }
        .btn-scan {
            background: var(--accent);
            color: white;
            width: 100%;
            margin-bottom: 10px;
            font-size: 16px;
        }
        /* Fixed Video Container Layout constraints */
        #scanner-container {
            width: 100%;
            max-width: 350px;
            min-height: 250px;
            margin: 10px auto;
            border-radius: 12px;
            overflow: hidden;
            display: none; /* Managed explicitly via JS now */
            background: #000;
        }
        .log-item {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #e5e5ea;
        }
        .clear-btn {
            background: var(--danger);
            color: white;
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            font-weight: 600;
            margin-top: 10px;
            font-size: 16px;
        }
        #api-result-banner {
            background: #e5e5ea;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 10px;
            font-size: 14px;
            display: none;
        }
        #debug-log {
            background: #1c1c1e;
            color: #34c759;
            font-family: monospace;
            font-size: 11px;
            padding: 10px;
            border-radius: 8px;
            margin-top: 10px;
            max-height: 100px;
            overflow-y: auto;
            display: block;
        }
    </style>
</head>
<body>

    <div class="header">
        <div>Today's Protein Intake</div>
        <div class="total-display"><span id="total-protein">0</span>g</div>
    </div>

    <!-- Barcode Scanner Card -->
    <div class="card">
        <h2>Live Barcode Lookup</h2>
        <button class="btn-scan" id="toggle-scan-btn" onclick="toggleScanner()">Open Camera Scanner</button>
        
        <div id="scanner-container">
            <div id="interactive" style="width: 100%;"></div>
        </div>
        
        <div id="api-result-banner"></div>
        
        <div class="custom-form" id="weight-form" style="display: none; margin-top: 10px;">
            <input type="number" id="scan-serving-weight" placeholder="Weight eaten (g)" value="100" class="input-short">
            <button class="btn-add" onclick="commitScannedFood()">Log Item</button>
            <button class="btn-cancel" onclick="cancelScannedFood()">Cancel</button>
        </div>

        <!-- Debug Box to catch iOS layout or library rejection alerts -->
        <div id="debug-log">System Status: Ready</div>
    </div>

    <!-- Custom Entry Card -->
    <div class="card">
        <h2>Manual Custom Entry</h2>
        <div class="custom-form">
            <input type="text" id="custom-name" placeholder="Food item (e.g. Snack)">
            <input type="number" id="custom-grams" placeholder="Grams" class="input-short">
            <button class="btn-add" onclick="logCustom()">Add</button>
        </div>
    </div>

    <!-- Daily Log Card -->
    <div class="card">
        <h2>Today's Log</h2>
        <div id="log-container"></div>
        <button class="clear-btn" onclick="clearLog()">Reset Day</button>
    </div>

    <script>
        let dailyLog = [];
        let html5QrcodeScanner = null;
        let lastScannedFood = null;

        function logDebug(msg) {
            const consoleBox = document.getElementById('debug-log');
            consoleBox.innerText = "Log: " + msg;
            console.log(msg);
        }

        function init() {
            const savedLog = localStorage.getItem('protein_daily_log');
            const savedDate = localStorage.getItem('protein_log_date');
            const todayStr = new Date().toDateString();

            if (savedDate !== todayStr) {
                dailyLog = [];
                localStorage.setItem('protein_log_date', todayStr);
                saveToLocalStorage();
            } else if (savedLog) {
                dailyLog = JSON.parse(savedLog);
            }
            updateUI();
        }

        // --- IMPROVED IOS COMPATIBLE SCANNER INITIALIZATION ---
        function toggleScanner() {
            const container = document.getElementById('scanner-container');
            const btn = document.getElementById('toggle-scan-btn');

            if (html5QrcodeScanner) {
                logDebug("Stopping active scanner module.");
                stopScanner();
            } else {
                logDebug("Initializing camera stream window layout...");
                
                // CRITICAL STEP: Make the div element visible in layout BEFORE initializing library hooks
                container.style.display = 'block';
                btn.innerText = 'Close Scanner';
                btn.style.background = 'var(--danger)';
                
                try {
                    html5QrcodeScanner = new Html5Qrcode("interactive");
                    logDebug("Library instance created. Requesting iOS lens control...");
                    
                    html5QrcodeScanner.start(
                        { facingMode: "environment" }, // Target rear lens explicitly
                        { 
                            fps: 10, 
                            qrbox: function(width, height) {
                                return { width: Math.min(width * 0.8, 250), height: 150 };
                            }
                        },
                        onScanSuccess,
                        onScanFailure
                    ).then(() => {
                        logDebug("Camera active. Align barcode inside viewfinder window.");
                    }).catch(err => {
                        logDebug(`iOS Permission or Protocol Error: ${err}`);
                        alert("Camera Access Blocked: Ensure your address bar says HTTPS, not HTTP.");
                        cleanupScannerState();
                    });
                } catch (e) {
                    logDebug(`Initialization exception error: ${e.message}`);
                    cleanupScannerState();
                }
            }
        }

        function onScanFailure(error) {
            // Drop silent exceptions for unaligned frames to maximize scanning speed
        }

        function stopScanner() {
            if (html5QrcodeScanner) {
                html5QrcodeScanner.stop().then(() => {
                    cleanupScannerState();
                    logDebug("Scanner closed cleanly.");
                }).catch(err => {
                    logDebug(`Stop fallthrough catch triggered: ${err}`);
                    cleanupScannerState();
                });
            } else {
                cleanupScannerState();
            }
        }

        function cleanupScannerState() {
            html5QrcodeScanner = null;
            document.getElementById('scanner-container').style.display = 'none';
            document.getElementById('toggle-scan-btn').innerText = 'Open Camera Scanner';
            document.getElementById('toggle-scan-btn').style.background = 'var(--accent)';
            document.getElementById('interactive').innerHTML = '';
        }

        async function onScanSuccess(decodedText) {
