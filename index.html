<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ProteinLog">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="manifest" href="manifest.json">
    <title>Protein Tracker</title>
    <style>
        :root {
            --bg-color: #f2f2f7;
            --card-bg: #ffffff;
            --primary: #34c759;
            --text: #1c1c1e;
            --text-muted: #8e8e93;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            padding: 20px;
            padding-top: 60px; /* Safe area padding layout for iOS status bar notch */
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .total-display {
            font-size: 48px;
            font-weight: 700;
            color: var(--primary);
            margin: 10px 0;
        }
        .card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        h2 {
            margin-top: 0;
            font-size: 18px;
            font-weight: 600;
        }
        .db-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        .food-btn {
            background: #e5e5ea;
            border: none;
            padding: 12px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            text-align: left;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
        }
        .food-btn span {
            color: var(--text-muted);
        }
        .custom-form {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            width: 100%;
        }
        input {
            flex: 1;
            min-width: 120px;
            padding: 12px;
            border: 1px solid #d1d1d6;
            border-radius: 10px;
            font-size: 16px; /* 16px input font strictly limits automatic iOS layout zoom zooming crashes */
            box-sizing: border-box;
        }
        .input-short {
            max-width: 90px;
        }
        .btn-add {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            flex-grow: 1;
            text-align: center;
            font-size: 15px;
        }
        .log-item {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #e5e5ea;
        }
        .log-item:last-child {
            border-bottom: none;
        }
        .clear-btn {
            background: #ff3b30;
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            font-weight: 600;
            margin-top: 10px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="header">
        <div>Today's Protein Intake</div>
        <div class="total-display"><span id="total-protein">0</span>g</div>
    </div>

    <!-- Quick Database Card -->
    <div class="card">
        <h2>Quick Add Database</h2>
        <div class="db-grid" id="db-container"></div>
    </div>

    <!-- Custom Entry Card -->
    <div class="card">
        <h2>Manual Custom Entry</h2>
        <div class="custom-form">
            <input type="text" id="custom-name" placeholder="Food item (e.g. Snack)">
            <input type="number" id="custom-grams" placeholder="Grams" class="input-short">
            <button class="btn-add" onclick="logCustom()">Add Item</button>
        </div>
    </div>

    <!-- Daily Log Card -->
    <div class="card">
        <h2>Today's Log</h2>
        <div id="log-container"></div>
        <button class="clear-btn" onclick="clearLog()">Reset Day</button>
    </div>

    <script>
        // 1. Built-in Local Food Profile Matrix (You can freely append items right here)
        const foodDatabase = [
            { name: "Chicken Breast (100g)", protein: 31 },
            { name: "Large Egg (1x)", protein: 6 },
            { name: "Greek Yogurt (150g)", protein: 15 },
            { name: "Canned Tuna (1 can)", protein: 30 },
            { name: "Whey Scoop (1x)", protein: 25 },
            { name: "Peanut Butter (2 tbsp)", protein: 8 }
        ];

        let dailyLog = [];

        // 2. Synchronous initialization engine hook via window layout bindings
        window.onload = function() {
            init();
        };

        function init() {
            const savedLog = localStorage.getItem('protein_daily_log');
            const savedDate = localStorage.getItem('protein_log_date');
            const todayStr = new Date().toDateString();

            // Auto-wipes yesterday's logged entries if a new day has rolled over
            if (savedDate !== todayStr) {
                dailyLog = [];
                localStorage.setItem('protein_log_date', todayStr);
                saveToLocalStorage();
            } else if (savedLog) {
                dailyLog = JSON.parse(savedLog);
            }

            renderDatabase();
            updateUI();

            // Active register protocol for the PWA offline worker module script
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('sw.js')
                    .then(() => console.log('Offline Engine Armed.'))
                    .catch(err => console.log('Worker registration failed', err));
            }
        }

        function renderDatabase() {
            const container = document.getElementById('db-container');
            container.innerHTML = '';
            foodDatabase.forEach(item => {
                const btn = document.createElement('button');
                btn.className = 'food-btn';
                btn.onclick = () => logProtein(item.name, item.protein);
                btn.innerHTML = `${item.name} <span>+${item.protein}g</span>`;
                container.appendChild(btn);
            });
        }

        function logProtein(name, grams) {
            if (!name || isNaN(grams) || grams <= 0) return;
            dailyLog.push({ 
                name, 
                protein: parseInt(grams), 
                time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) 
            });
            saveToLocalStorage();
            updateUI();
        }

        function logCustom() {
            const nameInput = document.getElementById('custom-name');
            const gramsInput = document.getElementById('custom-grams');
            
            logProtein(nameInput.value || "Custom Item", parseInt(gramsInput.value));
            
            nameInput.value = '';
            gramsInput.value = '';
        }

        function updateUI() {
            const total = dailyLog.reduce((sum, item) => sum + item.protein, 0);
            document.getElementById('total-protein').innerText = total;

            const logContainer = document.getElementById('log-container');
            logContainer.innerHTML = '';

            if (dailyLog.length === 0) {
                logContainer.innerHTML = '<p style="color:var(--text-muted); text-align:center;">No entries logged today.</p>';
                return;
            }

            dailyLog.forEach(item => {
                const row = document.createElement('div');
                row.className = 'log-item';
                row.innerHTML = `<div><strong>${item.name}</strong> <span style="font-size:12px; color:var(--text-muted);">${item.time}</span></div><div>${item.protein}g</div>`;
                logContainer.appendChild(row);
            });
        }

        function saveToLocalStorage() {
            localStorage.setItem('protein_daily_log', JSON.stringify(dailyLog));
        }

        function clearLog() {
            if(confirm("Are you sure you want to reset today's log?")) {
                dailyLog = [];
                saveToLocalStorage();
                updateUI();
            }
        }
    </script>
</body>
</html>
