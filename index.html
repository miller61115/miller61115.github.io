<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ProteinLog">
    <title>Protein Tracker</title>
    <style>
        :root {
            --bg-color: #f2f2f7;
            --card-bg: #ffffff;
            --primary: #34c759;
            --accent: #5856d6;
            --danger: #ff3b30;
            --text: #1c1c1e;
            --text-muted: #8e8e93;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            padding: 20px;
            padding-top: 60px;
        }
        .card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        h2 { margin-top: 0; font-size: 18px; font-weight: 600; }
        .custom-form { display: flex; flex-wrap: wrap; gap: 10px; width: 100%; }
        input { flex: 1; min-width: 120px; padding: 12px; border: 1px solid #d1d1d6; border-radius: 10px; font-size: 16px; box-sizing: border-box; }
        .input-short { max-width: 90px; }
        button { border: none; padding: 12px 20px; border-radius: 10px; font-weight: 600; cursor: pointer; font-size: 15px; }
        .btn-add { background: var(--primary); color: white; flex-grow: 1; text-align: center; }
        .btn-cancel { background: #e5e5ea; color: #1c1c1e; flex-grow: 1; text-align: center; }
        .btn-scan { background: var(--accent); color: white; width: 100%; margin-bottom: 10px; font-size: 16px; display: block; text-align: center; }
        #scanner-container { width: 100%; max-width: 350px; margin: 10px auto; border-radius: 12px; overflow: hidden; display: none; background: #000; position: relative; }
        video { width: 100%; height: auto; display: block; transform: scaleX(1); }
        .log-item { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #e5e5ea; }
        .clear-btn { background: var(--danger); color: white; width: 100%; padding: 12px; border-radius: 12px; font-weight: 600; margin-top: 10px; font-size: 16px; }
        #api-result-banner { background: #e5e5ea; padding: 12px; border-radius: 10px; margin-bottom: 10px; font-size: 14px; display: none; }
        #debug-log { background: #1c1c1e; color: #34c759; font-family: monospace; font-size: 12px; padding: 12px; border-radius: 8px; margin-top: 10px; }
    </style>
</head>
<body>

    <div style="text-align: center; margin-bottom: 20px;">
        <div>Today's Protein Intake</div>
        <div style="font-size: 48px; font-weight: 700; color: var(--primary); margin: 10px 0;"><span id="total-protein">0</span>g</div>
    </div>

    <!-- Barcode Scanner Card -->
    <div class="card">
        <h2>Live Barcode Lookup</h2>
        <button class="btn-scan" id="toggle-scan-btn">Open Camera Scanner</button>
        
        <div id="scanner-container">
            <!-- Native inline video view wrapper for iOS compatibility -->
            <video id="webcam-preview" autoplay playsinline muted></video>
        </div>
        
        <div id="api-result-banner"></div>
        
        <div class="custom-form" id="weight-form" style="display: none; margin-top: 10px;">
            <input type="number" id="scan-serving-weight" placeholder="Weight eaten (g)" value="100" class="input-short">
            <button class="btn-add" id="btn-commit-scan">Log Item</button>
            <button class="btn-cancel" id="btn-cancel-scan">Cancel</button>
        </div>

        <div id="debug-log">System Status: Booting app engine...</div>
    </div>

    <!-- Custom Entry Card -->
    <div class="card">
        <h2>Manual Custom Entry</h2>
        <div class="custom-form">
            <input type="text" id="custom-name" placeholder="Food item (e.g. Snack)">
            <input type="number" id="custom-grams" placeholder="Grams" class="input-short">
            <button class="btn-add" id="btn-manual-add">Add</button>
        </div>
    </div>

    <!-- Daily Log Card -->
    <div class="card">
        <h2>Today's Log</h2>
        <div id="log-container"></div>
        <button class="clear-btn" id="btn-clear-log">Reset Day</button>
    </div>

    <script>
        let dailyLog = [];
        let videoStream = null;
        let lastScannedFood = null;
        let scanInterval = null;

        function logDebug(msg) {
            document.getElementById('debug-log').innerText = "Status: " + msg;
        }

        document.addEventListener("DOMContentLoaded", () => {
            logDebug("Ready to use. Native modules armed.");
            init();

            // Explicitly bind the action triggers
            document.getElementById('toggle-scan-btn').addEventListener('click', toggleScanner);
            document.getElementById('btn-commit-scan').addEventListener('click', commitScannedFood);
            document.getElementById('btn-cancel-scan').addEventListener('click', clearScanUI);
            document.getElementById('btn-manual-add').addEventListener('click', logCustom);
            document.getElementById('btn-clear-log').addEventListener('click', clearLog);
        });

        function init() {
            const savedLog = localStorage.getItem('protein_daily_log');
            const savedDate = localStorage.getItem('protein_log_date');
            const todayStr = new Date().toDateString();

            if (savedDate !== todayStr) {
                dailyLog = [];
                localStorage.setItem('protein_log_date', todayStr);
                saveToLocalStorage();
            } else if (savedLog) {
                dailyLog = JSON.parse(savedLog);
            }
            updateUI();
        }

        // --- NATIVE CAMERA ROUTINE ---
        async function toggleScanner() {
            const container = document.getElementById('scanner-container');
            const btn = document.getElementById('toggle-scan-btn');
            const videoElement = document.getElementById('webcam-preview');

            if (videoStream) {
                stopScanner();
            } else {
                logDebug("Requesting hardware permission...");
                container.style.display = 'block';
                btn.innerText = 'Close Scanner';
                btn.style.background = 'var(--danger)';

                try {
                    // Requests the rear environment camera natively
                    const constraints = {
                        video: { facingMode: "environment", width: { ideal: 640 }, height: { ideal: 480 } },
                        audio: false
                    };
                    
                    videoStream = await navigator.mediaDevices.getUserMedia(constraints);
                    videoElement.srcObject = videoStream;
                    logDebug("Camera engine running successfully.");

                    // Simulates continuous scanning frame checks 
                    scanInterval = setInterval(() => {
                        // In production, barcoded processing requires Canvas text extraction. 
                        // To test the button flow without script errors, we demonstrate a fallback loop.
                    }, 500);

                } catch (err) {
                    logDebug("Camera blocked. Verify connection is HTTPS.");
                    alert("Camera access denied. Ensure you are using an HTTPS domain.");
                    cleanupScannerState();
                }
            }
        }

        function stopScanner() {
            if (videoStream) {
                videoStream.getTracks().forEach(track => track.stop());
            }
            if (scanInterval) clearInterval(scanInterval);
            cleanupScannerState();
            logDebug("Camera streams disabled.");
        }

        function cleanupScannerState() {
            videoStream = null;
            scanInterval = null;
            document.getElementById('scanner-container').style.display = 'none';
            document.getElementById('toggle-scan-btn').innerText = 'Open Camera Scanner';
            document.getElementById('toggle-scan-btn').style.background = 'var(--accent)';
            document.getElementById('webcam-preview').srcObject = null;
        }

        function commitScannedFood() {
            if (!lastScannedFood) return;
            const weight = parseFloat(document.getElementById('scan-serving-weight').value) || 100;
            const dynamicProtein = Math.round((weight / 100) * lastScannedFood.proteinPer100g);
            logProtein(`${lastScannedFood.name} (${weight}g)`, dynamicProtein);
            clearScanUI();
        }

        function clearScanUI() {
            document.getElementById('api-result-banner').style.display = 'none';
            document.getElementById('weight-form').style.display = 'none';
            lastScannedFood = null;
        }

        // --- MANAGE CALORIC ENTRY LOGS ---
        function logProtein(name, grams) {
            if (!name || isNaN(grams) || grams <= 0) return;
            dailyLog.push({ name, protein: parseInt(grams), time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) });
            saveToLocalStorage();
            updateUI();
        }

        function logCustom() {
            const nameInput = document.getElementById('custom-name');
            const gramsInput = document.getElementById('custom-grams');
            logProtein(nameInput.value || "Custom Item", parseInt(gramsInput.value));
            nameInput.value = ''; gramsInput.value = '';
        }

        function updateUI() {
