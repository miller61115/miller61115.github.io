<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ProteinLog">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="manifest" href="manifest.json">
    <title>Protein Tracker</title>
    
    <!-- Open-Source Barcode Scanner Library -->
    <script src="https://unpkg.com/html5-qrcode"></script>

    <style>
        :root {
            --bg-color: #f2f2f7;
            --card-bg: #ffffff;
            --primary: #34c759;
            --accent: #5856d6;
            --text: #1c1c1e;
            --text-muted: #8e8e93;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            padding: 20px;
            padding-top: 60px;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .total-display {
            font-size: 48px;
            font-weight: 700;
            color: var(--primary);
            margin: 10px 0;
        }
        .card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        h2 {
            margin-top: 0;
            font-size: 18px;
            font-weight: 600;
        }
        .custom-form {
            display: flex;
            gap: 10px;
        }
        input {
            flex: 1;
            padding: 12px;
            border: 1px solid #d1d1d6;
            border-radius: 10px;
            font-size: 16px;
        }
        button {
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-add {
            background: var(--primary);
            color: white;
        }
        .btn-scan {
            background: var(--accent);
            color: white;
            width: 100%;
            margin-bottom: 10px;
            font-size: 16px;
        }
        /* Scanner Video Area */
        #scanner-container {
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
            border-radius: 12px;
            overflow: hidden;
            display: none;
            background: #000;
        }
        .log-item {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #e5e5ea;
        }
        .clear-btn {
            background: #ff3b30;
            color: white;
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            font-weight: 600;
            margin-top: 10px;
        }
        #api-result-banner {
            background: #e5e5ea;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 10px;
            font-size: 14px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="header">
        <div>Today's Protein Intake</div>
        <div class="total-display"><span id="total-protein">0</span>g</div>
    </div>

    <!-- Barcode Scanner Card -->
    <div class="card">
        <h2>Live Barcode Lookup</h2>
        <button class="btn-scan" id="toggle-scan-btn" onclick="toggleScanner()">Open Camera Scanner</button>
        <div id="scanner-container">
            <div id="interactive" style="width: 100%;"></div>
        </div>
        
        <!-- Temporary area showing scanned food before adding -->
        <div id="api-result-banner"></div>
        
        <div class="custom-form" id="weight-form" style="display: none; margin-top: 10px;">
            <input type="number" id="scan-serving-weight" placeholder="Weight eaten (grams)" value="100">
            <button class="btn-add" onclick="commitScannedFood()">Log Scanned Item</button>
        </div>
    </div>

    <!-- Custom Entry Card -->
    <div class="card">
        <h2>Manual Custom Entry</h2>
        <div class="custom-form">
            <input type="text" id="custom-name" placeholder="Food item (e.g. Snack)">
            <input type="number" id="custom-grams" placeholder="Grams" style="max-width: 80px;">
            <button class="btn-add" onclick="logCustom()">Add</button>
        </div>
    </div>

    <!-- Daily Log Card -->
    <div class="card">
        <h2>Today's Log</h2>
        <div id="log-container"></div>
        <button class="clear-btn" onclick="clearLog()">Reset Day</button>
    </div>

    <script>
        let dailyLog = [];
        let html5QrcodeScanner = null;
        let lastScannedFood = null; // Holds temporary API results

        function init() {
            const savedLog = localStorage.getItem('protein_daily_log');
            const savedDate = localStorage.getItem('protein_log_date');
            const todayStr = new Date().toDateString();

            if (savedDate !== todayStr) {
                dailyLog = [];
                localStorage.setItem('protein_log_date', todayStr);
                saveToLocalStorage();
            } else if (savedLog) {
                dailyLog = JSON.parse(savedLog);
            }
            updateUI();
        }

        // --- BARCODE SCANNER LOGIC ---
        function toggleScanner() {
            const container = document.getElementById('scanner-container');
            const btn = document.getElementById('toggle-scan-btn');

            if (html5QrcodeScanner && html5QrcodeScanner.isScanning) {
                stopScanner();
            } else {
                container.style.display = 'block';
                btn.innerText = 'Close Scanner';
                btn.style.background = '#ff3b30';
                
                html5QrcodeScanner = new Html5Qrcode("interactive");
                html5QrcodeScanner.start(
                    { facingMode: "environment" }, // Forces the back camera on iPhone
                    { fps: 10, qrbox: { width: 250, height: 150 } }, // Ideal bounding box dimensions for barcodes
                    onScanSuccess
                ).catch(err => {
                    alert("Camera error: Ensure app is hosted over HTTPS and permission is granted.");
                    stopScanner();
                });
            }
        }

        function stopScanner() {
            if (html5QrcodeScanner) {
                html5QrcodeScanner.stop().then(() => {
                    document.getElementById('scanner-container').style.display = 'none';
                    document.getElementById('toggle-scan-btn').innerText = 'Open Camera Scanner';
                    document.getElementById('toggle-scan-btn').style.background = 'var(--accent)';
                }).catch(err => console.error(err));
            }
        }

        async function onScanSuccess(decodedText) {
            // Stop scanning immediately on a hit to prevent multiple duplicate fetch alerts
            stopScanner();
            
            const banner = document.getElementById('api-result-banner');
            banner.style.display = 'block';
            banner.innerText = `Searching barcode: ${decodedText}...`;

            try {
                // Fetch from the free Open Food Facts API
                const url = `https://world.openfoodfacts.org/api/v2/product/${decodedText}.json`;
                const response = await fetch(url);
                const data = await response.json();

                if (data.status === 1 && data.product) {
                    const prod = data.product;
                    const name = prod.product_name || "Unknown Barcode Item";
                    // Open Food Facts returns values strictly per 100g base layout
                    const protein100g = prod.nutriments ? prod.nutriments.proteins_100g : null;

                    if (protein100g !== undefined && protein100g !== null) {
                        lastScannedFood = { name: name, proteinPer100g: parseFloat(protein100g) };
                        
                        banner.innerHTML = `<strong>Found:</strong> ${name}<br>🧬 Baseline: ${protein100g}g protein per 100g`;
                        document.getElementById('weight-form').style.display = 'flex';
                    } else {
                        banner.innerText = `Found "${name}", but no protein data is documented in the Open Food Facts API registry.`;
                    }
                } else {
                    banner.innerText = "Barcode not found in Open Food Facts database.";
                }
            } catch (err) {
                banner.innerText = "Network error. Make sure your iPhone is connected to the internet to perform barcode queries.";
            }
        }

        function commitScannedFood() {
            if (!lastScannedFood) return;
            const weightInput = document.getElementById('scan-serving-weight');
            const weightEaten = parseFloat(weightInput.value) || 100;

            // Mathematical translation of base-100g values into standard user serving sizing
            const dynamicProtein = Math.round((weightEaten / 100) * lastScannedFood.proteinPer100g);

            logProtein(`${lastScannedFood.name} (${weightEaten}g)`, dynamicProtein);

            // Clean up UI banner areas
            document.getElementById('api-result-banner').style.display = 'none';
            document.getElementById('weight-form').style.display = 'none';
            lastScannedFood = null;
        }

        // --- LOCAL LOGGING LOGIC ---
        function logProtein(name, grams) {
            if (!name || isNaN(grams) || grams <= 0) return;
            dailyLog.push({ 
                name, 
                protein: parseInt(grams), 
                time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) 
            });
            saveToLocalStorage();
            updateUI();
        }

        function logCustom() {
            const nameInput = document.getElementById('custom-name');
            const gramsInput = document.getElementById('custom-grams');
            logProtein(nameInput.value || "Custom Item", parseInt(gramsInput.value));
            nameInput.value = '';
            gramsInput.value = '';
        }

        function updateUI() {
            const total = dailyLog.reduce((sum, item) => sum + item.protein, 0);
            document.getElementById('total-protein').innerText = total;

            const logContainer = document.getElementById('log-container');
            logContainer.innerHTML = '';

            if (dailyLog.length === 0) {
                logContainer.innerHTML = '<p style="color:var(--text-muted); text-align:center;">No entries logged today.</p>';
                return;
            }

            dailyLog.forEach(item => {
                const row = document.createElement('div');
                row.className = 'log-item';
                row.innerHTML = `<div><strong>${item.name}</strong> <span style="font-size:12px; color:var(--text-muted);">${item.time}</span></div><div>${item.protein}g</div>`;
                logContainer.appendChild(row);
            });
        }

        function saveToLocalStorage() {
            localStorage.setItem('protein_daily_log', JSON.stringify(dailyLog));
        }

        function clearLog() {
            if(confirm("Reset today's logs?")) {
                dailyLog = [];
                saveToLocalStorage();
                updateUI();
            }
        }

        init();
    </script>
</body>
</html>
